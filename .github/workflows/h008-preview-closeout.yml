name: Build H008 portfolio preview

on:
  push:
    branches:
      - docs/h008-preview-closeout

permissions:
  contents: write

jobs:
  build-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out closeout branch
        uses: actions/checkout@v4

      - name: Compile portfolio report
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: portfolio-report-template
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Publish curated preview
        shell: bash
        run: |
          mkdir -p portfolio-report-template/preview
          cp portfolio-report-template/main.pdf \
            portfolio-report-template/preview/portfolio-report-template-preview.pdf

      - name: Commit preview artifact
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f portfolio-report-template/preview/portfolio-report-template-preview.pdf
          git commit -m "docs: publish H008 portfolio preview"
          git push
